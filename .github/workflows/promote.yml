---
name: Promote channel

on:
  workflow_dispatch:
    inputs:
      target:
        description: "Channel to promote to"
        type: choice
        options: [beta, stable]
        required: true
      source:
        description: "Source tag to promote from (e.g. testing or testing.20260608)"
        type: string
        default: testing
      version:
        description: "Release version matching the image (e.g. 1.4.8); mandatory for stable. An existing version cannot be replaced with another digest."
        type: string
        default: ""
      expected_digest:
        description: "Exact sha256 digest of the qualified image; promotion stops if the source tag changed"
        type: string
        required: true

env:
  IMAGE_NAME: ${{ github.event.repository.name }}
  IMAGE_REGISTRY: "ghcr.io/${{ github.repository_owner }}"

concurrency:
  # Serialize beta AND stable: either can create a permanent version tag.
  group: nebel-image-promotion
  cancel-in-progress: false

jobs:
  promote:
    if: github.ref == format('refs/heads/{0}', github.event.repository.default_branch)
    name: Promote ${{ inputs.source }} -> ${{ inputs.target }}
    runs-on: ubuntu-latest

    permissions:
      contents: read
      packages: write

    steps:
      - name: Checkout
        uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0

      - name: Prepare environment
        run: |
          echo "IMAGE_REGISTRY=${IMAGE_REGISTRY,,}" >> "${GITHUB_ENV}"
          echo "IMAGE_NAME=${IMAGE_NAME,,}" >> "${GITHUB_ENV}"
          command -v skopeo >/dev/null || { sudo apt-get update && sudo apt-get install -y skopeo; }

      - name: Install cosign
        uses: sigstore/cosign-installer@6f9f17788090df1f26f669e9d70d6ae9567deba6 # v4.1.2
        with:
          cosign-release: 'v2.6.3'

      - name: Log in to ghcr.io
        env:
          REGISTRY_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          REGISTRY_ACTOR: ${{ github.actor }}
        run: printf '%s' "$REGISTRY_TOKEN" | skopeo login ghcr.io -u "$REGISTRY_ACTOR" --password-stdin

      - name: Verify approved image and promote without replacing release versions
        env:
          PROMOTE_SOURCE: ${{ inputs.source }}
          PROMOTE_TARGET: ${{ inputs.target }}
          PROMOTE_VERSION: ${{ inputs.version }}
          PROMOTE_DIGEST: ${{ inputs.expected_digest }}
        run: |
          set -euo pipefail
          python3 tools/promote-image.py \
            --repository "${IMAGE_REGISTRY}/${IMAGE_NAME}" \
            --source "$PROMOTE_SOURCE" --target "$PROMOTE_TARGET" \
            --version "$PROMOTE_VERSION" --expected-digest "$PROMOTE_DIGEST" \
            --key system_files/etc/pki/containers/nebel.pub
