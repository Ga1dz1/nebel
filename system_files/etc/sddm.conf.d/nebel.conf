[Autologin]
Relogin=true
Session=gamescope-session-steam.desktop
User=nebel

[General]
DisplayServer=wayland
# Panel is 1080x1240 on a ~4" handheld screen; match the Plasma desktop's 1.5x.
GreeterEnvironment=QT_SCALE_FACTOR=1.5
HaltCommand=/usr/bin/systemctl poweroff
RebootCommand=/usr/bin/systemctl reboot
