# The QCA6390 on Mini V2 has no factory MAC that mainline ath11k can read
# (board_id comes back 0xff), so the kernel's "permanent" address is actually
# random on every boot - DHCP then hands out a new IP each time. "stable"
# derives one persistent MAC from machine-id+SSID instead.
[device]
wifi.scan-rand-mac-address=no

[connection]
wifi.cloned-mac-address=stable
ethernet.cloned-mac-address=permanent
