# WirePlumber drop-in for Retroid Pocket Mini / Mini V2 (SM8250).
#
# The Qualcomm qdsp6 routing path on SM8250 opens its ADM "COPP" with
# NULL_COPP_TOPOLOGY -- a bit-exact passthrough that performs no sample-format
# conversion. Without the kernel's 0100-revert-force-16bit-audio.patch this is
# hard-required for every stream; with it, only compressed streams are forced
# S16_LE at the kernel level, but forcing it here too is harmless and matches
# what ROCKNIX ships alongside the same kernel patch.
#
# Card name confirmed via `wpctl inspect <alsa device id>` on real hardware
# (nebel-sm8250-handoff SSH session, 2026-07-17): alsa.card_name is
# "RetroidPocket" - not the DT model string or a slugified guess.
#
# api.alsa.soft-mixer (ported from pocknix-os's 51-pocknix-softmixer.conf,
# devices/sm8250): keep PipeWire OFF the hardware mixer for this card. The
# UCM boot path is hot by design (small drivers need the gain), but
# PipeWire's hardware-volume mapping treats 100% as 0dB total path gain and
# pulls those controls down, which is why Steam (via PipeWire) ends up
# drastically quieter than raw-ALSA players on this hardware. soft-mixer
# leaves the UCM boot values planted and applies volume in software below
# that ceiling.
monitor.alsa.rules = [
  {
    matches = [
      { alsa.card_name = "RetroidPocket" }
    ]
    actions = {
      update-props = {
        audio.format = "S16LE"
        api.alsa.soft-mixer = true
      }
    }
  }
]
