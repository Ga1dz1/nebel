[general]
default_profile=balanced
# Auto-switch profile on AC/dock connect and disconnect (not continuously -
# only right at the transition, so a manual profile change in between isn't
# fought). Disable by setting this to 0 in /etc/nebel/power-profiles.conf.
auto_profile_by_power_source=1
auto_profile_ac=performance
auto_profile_battery=balanced

[profile.eco]
label=Eco
cpu_governor=schedutil
cpu_max=0.65
cpu_underclock=large
gpu_max=0.80
gpu_min=0.0
fan_curve=relaxed

[profile.balanced]
label=Balanced
cpu_governor=schedutil
cpu_max=0.65
cpu_underclock=medium
gpu_max=1.0
gpu_min=0.60
fan_curve=moderate

[profile.performance]
label=Performance
cpu_governor=performance
cpu_max=1.0
cpu_underclock=none
gpu_max=1.0
gpu_min=1.0
fan_curve=aggressive

[fan_curve.relaxed]
label=Relaxed
curve=98:255,94:204,88:153,82:102,76:77,65:51,0:51

[fan_curve.moderate]
label=Moderate
curve=96:255,90:204,84:153,78:102,72:77,55:51,0:51

[fan_curve.aggressive]
label=Aggressive
curve=90:255,85:204,80:153,74:102,66:77,45:51,0:51

[fan]
min_pwm=51
max_pwm=255
ramp_up=36
ramp_down=6
smoothing=0.50
pwm_quantum=8

[suspend]
fan_safe_above=55
fan_low_pwm=51
fan_safe_pwm=128

