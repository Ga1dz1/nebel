[underclock.SM8250.medium]
# Stock max frequencies (confirmed live via cpuinfo_max_freq on real Mini V2
# hardware) - i.e. no underclock at all for the "balanced" (default) profile,
# matching ROCKNIX's own SM8250 setup, which applies no CPU cap by default.
# The previous values here cut ~20% off every cluster, which is very likely
# most of the "nebel runs ~2x worse than ROCKNIX" gap reported for Mini V2/
# RP5/Flip2. GPU was already unaffected (gpu_max=1.0 already ran at its own
# hardware max, confirmed live: cur_freq == the top of available_frequencies).
cpu_max_policy0=1804800
cpu_max_policy4=2419200
cpu_max_policy7=2841600

[underclock.SM8250.large]
cpu_max_policy0=1248000
cpu_max_policy4=1670400
cpu_max_policy7=1977600
