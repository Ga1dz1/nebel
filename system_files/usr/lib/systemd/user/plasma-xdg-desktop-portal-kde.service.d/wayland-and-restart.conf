# The user manager can carry a stale DISPLAY (leaked from a gamescope session
# switch) when this portal gets dbus-activated early in game mode: Qt then
# picks xcb, fails to connect and the one-shot portal is gone for the whole
# boot - Steam's "Browse..." file dialog stops opening in desktop mode.
# Force the wayland backend (immune to stale X) and allow recovery restarts.
[Service]
Environment=QT_QPA_PLATFORM=wayland
Restart=on-failure
RestartSec=2
