[Service]
# Plasma's dbus-update-activation-environment leaks WAYLAND_DISPLAY/DISPLAY
# into the user manager, and they survive the switch back to game mode
# (user@1000 outlives the Plasma session). Inherited here, they make
# gamescope pick its nested wayland backend instead of DRM - the black
# screen with working sound when returning from desktop mode. Drop them
# before starting the session; gamescope then opens DRM via seatd again.
ExecStartPre=/usr/bin/systemctl --user unset-environment WAYLAND_DISPLAY DISPLAY

# Tag the game mode session as its own desktop so xdg-desktop-portal picks
# gamescope-portals.conf (GTK backend) instead of waking the KDE backend
# against a missing display. Both the session's own env and the user manager
# env (dbus-activated portals inherit from the latter) need the value;
# desktop-bootstrap imports XDG_CURRENT_DESKTOP=KDE back on desktop entry.
Environment=XDG_CURRENT_DESKTOP=gamescope
ExecStartPre=/usr/bin/systemctl --user set-environment XDG_CURRENT_DESKTOP=gamescope
