# ADSP/CDSP remoteproc can probe before the real root is mounted (initramfs
# phase). Without the firmware there the boot fails with ENOENT and ADSP never
# comes up: no audio, no battmgr battery data, no MCU-routed keys. Seen on RP6
# with the 7.0.11 round-2 patch set, whose regulator probe-order changes let
# remoteproc win the race against switch-root (previously it deferred past it).
install_items+=" /usr/lib/firmware/qcom/sm8550/ayn/odin2/adsp.mbn /usr/lib/firmware/qcom/sm8550/ayn/odin2/adsp_dtb.mbn /usr/lib/firmware/qcom/sm8550/ayn/odin2/adspr.jsn /usr/lib/firmware/qcom/sm8550/ayn/odin2/adsps.jsn /usr/lib/firmware/qcom/sm8550/ayn/odin2/adspua.jsn /usr/lib/firmware/qcom/sm8550/ayn/odin2/aw883xx_acf.bin /usr/lib/firmware/qcom/sm8550/ayn/odin2/battmgr.jsn /usr/lib/firmware/qcom/sm8550/ayn/cdsp.mbn /usr/lib/firmware/qcom/sm8550/ayn/cdsp_dtb.mbn "
