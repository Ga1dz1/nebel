NEBEL_DEVICE_ID=retroid-pocket-mini-v2
NEBEL_DEVICE_NAME='Retroid Pocket Mini V2'
NEBEL_SOC_CLASS=SM8250

NEBEL_PRIMARY_CONNECTOR=DSI-1
NEBEL_PANEL_ORIENTATION=right
NEBEL_PANEL_NATIVE_WIDTH=1080
NEBEL_PANEL_NATIVE_HEIGHT=1240
NEBEL_PANEL_REFRESH_RATES=60
NEBEL_GAMESCOPE_USE_ROTATION_SHADER=1
# gamescope's GAMESCOPE_FAKE_OUTPUT_MM feeds wl_output phys_width/phys_height
# directly in place of the DRM connector's mmWidth/mmHeight (see
# armada-packages' 0004-DRMBackend patch) - i.e. native/pre-rotation
# orientation, matching NEBEL_PANEL_NATIVE_WIDTH/HEIGHT above, NOT the
# post-rotation landscape view.
#
# These are deliberately NOT the panel's true physical size (65x75mm, 3.92"
# at 422dpi). Steam's "Automatically scale interface" heuristic keys off the
# reported DPI, and at 422dpi it computes AutoScaleFactor ~3.1 - a comically
# oversized UI. Reporting 127x146mm (~215dpi, "8 inch") lands auto-scale at
# 1.60 (verified live in a game-mode session: ScaleFactor==AutoScaleFactor
# ==1.6009), matching the 1.586 our nebel-fix-steam-scale seeds for manual
# mode - so auto and manual now agree. The trade-off: anything sizing UI by
# physical DPI sees a milder density, which is what we want on this panel.
NEBEL_GAMESCOPE_FAKE_OUTPUT_MM=127x146

# fake-suspend never actually powers the SoC down - it just freezes
# userspace and blanks the screen, which is why the button never produced a
# "full" sleep. Real suspend (s2idle) has been live-tested repeatedly on
# this exact device this cycle: the wifi-reconnect fix (rfkill block/unblock
# around sleep, see 50-nebel-real-suspend) reassociated in 1-9s across
# every retest, and the power-key rebound guard in powerbuttond covers the
# wake-press-read-as-a-new-press race.
NEBEL_SUSPEND_MODE=mem

# Internal touchscreen (FocalTech; kernel appends an unstable instance suffix,
# touchscreen-inhibit matches by prefix). Game mode inhibits it while an
# external display owns the session.
NEBEL_INTERNAL_TOUCHSCREEN='generic ft5x06'
# Calibrated 2026-08-28 by corner-tapping the panel in external-primary game
# mode (with the raw node properly starved by the daemon's grab - a leaking
# raw stream masks any daemon transform): panel-right = +raw Y, panel-down =
# -raw X, i.e. exactly the "right" rotation. Do NOT trust NEBEL_PANEL_
# ORIENTATION here blindly on other devices: verify per device.
NEBEL_INTERNAL_TOUCHPAD_ROTATION=right

# External touchscreens known to dock with this device (|-separated list,
# prefix-matched). desktop-bootstrap pins each to its own output so taps land
# on the screen being touched.
NEBEL_EXTERNAL_TOUCHSCREENS='RetroidPocket RDS Touchscreen'
