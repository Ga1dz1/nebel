NEBEL_DEVICE_ID=retroid-pocket-mini-v2
NEBEL_DEVICE_NAME='Retroid Pocket Mini V2'
NEBEL_SOC_CLASS=SM8250

NEBEL_PRIMARY_CONNECTOR=DSI-1
NEBEL_PANEL_ORIENTATION=right
NEBEL_PANEL_NATIVE_WIDTH=1080
NEBEL_PANEL_NATIVE_HEIGHT=1240
NEBEL_PANEL_REFRESH_RATES=60
NEBEL_GAMESCOPE_USE_ROTATION_SHADER=1
# 3.92" diagonal (Retroid spec) at 1080x1240 native (portrait). gamescope's
# GAMESCOPE_FAKE_OUTPUT_MM feeds wl_output phys_width/phys_height directly in
# place of the DRM connector's mmWidth/mmHeight (see armada-packages'
# 0004-DRMBackend patch) - i.e. native/pre-rotation orientation, matching
# NEBEL_PANEL_NATIVE_WIDTH/HEIGHT above, NOT the post-rotation landscape
# view. Width(1080px)=65mm, height(1240px)=75mm. Getting this backwards is
# what made Steam's AutoScaleFactor come out ~2x too large on first launch.
NEBEL_GAMESCOPE_FAKE_OUTPUT_MM=65x75

# fake-suspend never actually powers the SoC down - it just freezes
# userspace and blanks the screen, which is why the button never produced a
# "full" sleep. Real suspend (s2idle) has been live-tested repeatedly on
# this exact device this cycle: the wifi-reconnect fix (rfkill block/unblock
# around sleep, see 50-nebel-real-suspend) reassociated in 1-9s across
# every retest, and the power-key rebound guard in powerbuttond covers the
# wake-press-read-as-a-new-press race.
NEBEL_SUSPEND_MODE=mem

# Internal touchscreen (FocalTech; kernel appends an unstable instance suffix,
# touchscreen-inhibit matches by prefix). Game mode inhibits it while an
# external display owns the session.
NEBEL_INTERNAL_TOUCHSCREEN='generic ft5x06'

# External touchscreens known to dock with this device (|-separated list,
# prefix-matched). desktop-bootstrap pins each to its own output so taps land
# on the screen being touched.
NEBEL_EXTERNAL_TOUCHSCREENS='RetroidPocket RDS Touchscreen'
