NEBEL_DEVICE_ID=retroid-pocket-6
NEBEL_DEVICE_NAME='Retroid Pocket 6'
NEBEL_SOC_CLASS=SM8550

NEBEL_PRIMARY_CONNECTOR=DSI-1
NEBEL_PANEL_ORIENTATION=left
NEBEL_PANEL_NATIVE_WIDTH=1080
NEBEL_PANEL_NATIVE_HEIGHT=1920
NEBEL_PANEL_REFRESH_RATES=60,120
NEBEL_GAMESCOPE_USE_ROTATION_SHADER=1
NEBEL_GAMESCOPE_FAKE_OUTPUT_MM=177x100

# Real suspend (s2idle) is enabled on RP6. The SM8550 device-quirks script
# already disables CPU0's deep C-state to keep the GMU alive across sleep.
NEBEL_SUSPEND_MODE=mem

# Internal touchscreen (FocalTech; kernel appends an unstable instance suffix,
# touchscreen-inhibit matches by prefix). Game mode inhibits it while an
# external display owns the session.
NEBEL_INTERNAL_TOUCHSCREEN='generic ft5x06'

# External touchscreens known to dock with this device (|-separated list,
# prefix-matched). desktop-bootstrap pins each to its own output so taps land
# on the screen being touched.
NEBEL_EXTERNAL_TOUCHSCREENS='RetroidPocket RDS Touchscreen'
