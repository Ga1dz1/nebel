NEBEL_DEVICE_ID=retroid-pocket-mini
NEBEL_DEVICE_NAME='Retroid Pocket Mini'
NEBEL_SOC_CLASS=SM8250

# WORK IN PROGRESS - no Retroid Pocket Mini (V1) hardware to test against
# yet (dts: armada-packages kernel/dts/sm8250-retroidpocket-rpmini.dts,
# panel driver 0057_DDIC-CH13726A-panel.patch carries a ch13726a,rpmini
# mode). Values are first guesses derived from Mini V2's live-tested
# profile - expect corrections once a tester reports back.
NEBEL_PRIMARY_CONNECTOR=DSI-1

# V1's panel is a 960x1280 portrait-native AMOLED (the V1 scandal panel with
# the hardware scaler quirk - kernel drives its native mode, same as
# ROCKNIX). The DTS sets `rotation = <90>` on the panel node; per the RP5/
# Flip2 experience kernel-level rotation is honored by the desktop but NOT
# by gamescope, which comes up portrait regardless - so the userspace
# rotation shader stays on. `right` is Mini V2's live-verified value and is
# the starting guess here (same portrait-panel-held-landscape layout);
# UNVERIFIED on real V1 hardware - if the picture is off by 90/180, flip
# this to left/normal/inverted in that order.
NEBEL_PANEL_ORIENTATION=right
NEBEL_PANEL_NATIVE_WIDTH=960
NEBEL_PANEL_NATIVE_HEIGHT=1280
NEBEL_PANEL_REFRESH_RATES=60
NEBEL_GAMESCOPE_USE_ROTATION_SHADER=1

# Same Steam AutoScaleFactor dodge as Mini V2: this panel's true physical
# size (~56x75mm, 3.7" at ~435dpi) makes Steam's auto-scale compute a
# comically oversized UI, so report a fake ~8-inch panel (215dpi) instead.
# Lands auto-scale at ~1.6, matching the seeded manual scale.
NEBEL_GAMESCOPE_FAKE_OUTPUT_MM=127x146

# Real suspend (s2idle) - same SM8250 family and kernel as Mini V2, where
# the wifi-reconnect and power-key-rebound fixes have been live-tested
# repeatedly. NOT confirmed on real V1 hardware specifically.
NEBEL_SUSPEND_MODE=mem

# Internal touchscreen (FocalTech, same as Mini V2; kernel appends an
# unstable instance suffix, touchscreen-inhibit matches by prefix).
NEBEL_INTERNAL_TOUCHSCREEN='generic ft5x06'

# External touchscreens known to dock with this device (|-separated list,
# prefix-matched).
NEBEL_EXTERNAL_TOUCHSCREENS='RetroidPocket RDS Touchscreen'
